project_name: gh-next

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - formats: [binary]
    # gh extension install matches: strings.HasSuffix(asset.Name, "{os}-{arch}")
    # dash separator, raw binary (no tarball wrapping)
    name_template: "{{ .ProjectName }}_{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: checksums.txt

release:
  github:
    owner: maastrich
    name: gh-next
